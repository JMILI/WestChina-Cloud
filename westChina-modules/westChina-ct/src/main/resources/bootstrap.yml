# Tomcat
server:
  port: 9800

# CT AI 推理服务（Python FastAPI，scripts/start-ai.sh）
ct:
  ai:
    base-url: http://127.0.0.1:9810
    enabled: true
    connect-timeout-ms: 5000
    read-timeout-ms: 2400000

# Spring
spring:
  application:
    # 应用名称
    name: westChina-ct
  main:
    allow-bean-definition-overriding: true #当遇到同样名字的时候，是否允许覆盖注册
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: westChinaBackend:8848
      config:
        # 配置中心地址
        server-addr: westChinaBackend:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          - application-secret-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          # 无需使用动态多数据源则移除
          - application-datasource-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}