server {
    listen 5000;
    server_name localhost;

    location = / {
        return 302 /main/;
    }

    location /main/ {
        alias /usr/share/nginx/html/main/;
        try_files $uri $uri/ /main/index.html;
    }

    location /administrator/ {
        alias /usr/share/nginx/html/administrator/;
        try_files $uri $uri/ /administrator/index.html;
    }

    location /ct/ {
        alias /usr/share/nginx/html/ct/;
        try_files $uri $uri/ /ct/index.html;
    }

    location /prod-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://host.docker.internal:8080/;
    }

    location /api-ct/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://host.docker.internal:8090/;
    }

    location /api-ct-upload/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://host.docker.internal:8080/;
    }

    location /api-ct-minio/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://host.docker.internal:9000/;
    }
}
